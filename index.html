<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f6f3" />
    <meta name="description" content="Covenant is a Solana launchpad where builders bond SOL, supply and creator fees to three milestones. Prove them and it's released. Miss one and holders get it." />
    <title>Covenant · Roadmaps with something at stake</title>
    <script>
      // Light by default; apply a saved dark preference before first paint.
      try { if (localStorage.getItem('theme') === 'dark') { document.documentElement.classList.add('dark'); document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0b0c0e') } } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
